<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Neon blue glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feGaussianBlur stdDeviation="20" result="blur2"/>
      <feGaussianBlur stdDeviation="40" result="blur3"/>
      <feMerge>
        <feMergeNode in="blur3"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Inner glow -->
    <filter id="innerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Gradient for shield -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Gradient for crown -->
    <linearGradient id="crownGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>

    <!-- Background radial -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0c4a6e" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#030915" stop-opacity="0"/>
    </radialGradient>

    <!-- Sword blade gradient -->
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="40%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>

  <!-- Dark background circle -->
  <circle cx="256" cy="256" r="250" fill="#030915" stroke="#0ea5e9" stroke-width="2" opacity="0.95"/>
  <circle cx="256" cy="256" r="240" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.3"/>

  <!-- Ambient glow behind shield -->
  <circle cx="256" cy="270" r="120" fill="url(#bgGrad)"/>

  <!-- ═══════════ SHIELD ═══════════ -->
  <g filter="url(#glow)">
    <!-- Shield body -->
    <path d="
      M 256 100
      L 370 145
      L 370 260
      Q 370 340 256 400
      Q 142 340 142 260
      L 142 145
      Z
    " fill="none" stroke="url(#shieldGrad)" stroke-width="4" opacity="0.9"/>

    <!-- Shield inner fill -->
    <path d="
      M 256 108
      L 364 150
      L 364 258
      Q 364 334 256 392
      Q 148 334 148 258
      L 148 150
      Z
    " fill="#030915" stroke="none" opacity="0.85"/>

    <!-- Shield inner line -->
    <path d="
      M 256 120
      L 352 160
      L 352 255
      Q 352 325 256 380
      Q 160 325 160 255
      L 160 160
      Z
    " fill="none" stroke="#0ea5e9" stroke-width="1.5" opacity="0.25"/>
  </g>

  <!-- ═══════════ CROSSED SWORDS ═══════════ -->
  <g filter="url(#innerGlow)">
    <!-- Left sword (pointing up-right) -->
    <g transform="translate(256,250) rotate(-30)">
      <!-- Blade -->
      <rect x="-3" y="-110" width="6" height="95" rx="2" fill="url(#bladeGrad)" opacity="0.9"/>
      <!-- Blade tip -->
      <polygon points="0,-130 -4,-110 4,-110" fill="#e0f2fe" opacity="0.95"/>
      <!-- Guard -->
      <rect x="-14" y="-16" width="28" height="5" rx="2" fill="#38bdf8"/>
      <!-- Handle -->
      <rect x="-3" y="-11" width="6" height="18" rx="2" fill="#0ea5e9"/>
      <!-- Pommel -->
      <circle cx="0" cy="10" r="4" fill="#7dd3fc"/>
    </g>

    <!-- Right sword (pointing up-left) -->
    <g transform="translate(256,250) rotate(30)">
      <!-- Blade -->
      <rect x="-3" y="-110" width="6" height="95" rx="2" fill="url(#bladeGrad)" opacity="0.9"/>
      <!-- Blade tip -->
      <polygon points="0,-130 -4,-110 4,-110" fill="#e0f2fe" opacity="0.95"/>
      <!-- Guard -->
      <rect x="-14" y="-16" width="28" height="5" rx="2" fill="#38bdf8"/>
      <!-- Handle -->
      <rect x="-3" y="-11" width="6" height="18" rx="2" fill="#0ea5e9"/>
      <!-- Pommel -->
      <circle cx="0" cy="10" r="4" fill="#7dd3fc"/>
    </g>
  </g>

  <!-- ═══════════ CODE BRACKETS < /> ═══════════ -->
  <g filter="url(#innerGlow)">
    <!-- Left bracket < -->
    <text x="195" y="268" font-family="monospace" font-size="42" font-weight="bold" fill="#38bdf8" opacity="0.85" text-anchor="middle">&lt;</text>
    <!-- Right bracket > -->
    <text x="317" y="268" font-family="monospace" font-size="42" font-weight="bold" fill="#38bdf8" opacity="0.85" text-anchor="middle">&gt;</text>
    <!-- Slash / -->
    <text x="256" y="262" font-family="monospace" font-size="36" font-weight="bold" fill="#7dd3fc" opacity="0.7" text-anchor="middle">/</text>
  </g>

  <!-- ═══════════ CROWN ON TOP ═══════════ -->
  <g filter="url(#glow)" transform="translate(256, 95)">
    <!-- Crown base -->
    <rect x="-28" y="5" width="56" height="10" rx="3" fill="url(#crownGrad)" opacity="0.9"/>
    <!-- Crown points -->
    <polygon points="-28,5 -22,-12 -16,5" fill="#38bdf8" opacity="0.85"/>
    <polygon points="-10,5 0,-20 10,5" fill="#7dd3fc" opacity="0.9"/>
    <polygon points="16,5 22,-12 28,5" fill="#38bdf8" opacity="0.85"/>
    <!-- Crown jewels -->
    <circle cx="-22" cy="-6" r="3" fill="#e0f2fe" opacity="0.9"/>
    <circle cx="0" cy="-14" r="3.5" fill="#e0f2fe" opacity="0.95"/>
    <circle cx="22" cy="-6" r="3" fill="#e0f2fe" opacity="0.9"/>
  </g>

  <!-- ═══════════ SPARKLE DOTS ═══════════ -->
  <g opacity="0.6">
    <circle cx="120" cy="150" r="2" fill="#7dd3fc"/>
    <circle cx="395" cy="170" r="1.5" fill="#38bdf8"/>
    <circle cx="100" cy="300" r="1.5" fill="#0ea5e9"/>
    <circle cx="410" cy="290" r="2" fill="#7dd3fc"/>
    <circle cx="180" cy="400" r="1.5" fill="#38bdf8"/>
    <circle cx="330" cy="410" r="1.5" fill="#0ea5e9"/>
    <circle cx="130" cy="220" r="1" fill="#7dd3fc"/>
    <circle cx="385" cy="230" r="1" fill="#38bdf8"/>
  </g>

  <!-- ═══════════ TEXT: CODE ROYALE ═══════════ -->
  <g filter="url(#glow)">
    <!-- "CODE" -->
    <text x="256" y="452" font-family="'Segoe UI', Arial, sans-serif" font-size="48" font-weight="900" fill="#38bdf8" text-anchor="middle" letter-spacing="12" opacity="0.95">CODE</text>
    <!-- "ROYALE" -->
    <text x="256" y="492" font-family="'Segoe UI', Arial, sans-serif" font-size="32" font-weight="600" fill="#7dd3fc" text-anchor="middle" letter-spacing="18" opacity="0.75">ROYALE</text>
  </g>

  <!-- Subtle outer ring -->
  <circle cx="256" cy="256" r="248" fill="none" stroke="#0ea5e9" stroke-width="0.5" opacity="0.15"/>
</svg>
